# Inventario compartido por provision.yml y demo.yml.
# El servidor no es accesible directo: se salta por el gateway (ProxyJump).

[gateway]
gw ansible_host=192.168.56.10 ansible_user=jbjp_gw

[server]
mc ansible_host=10.10.10.10 ansible_user=jbjp_mc ansible_ssh_common_args='-o ProxyJump=jbjp_gw@192.168.56.10 -o StrictHostKeyChecking=no'

[attacker]
blackwall ansible_connection=local

[all:vars]
atacante_ip=192.168.56.1
gw_lan_ip=192.168.56.10
